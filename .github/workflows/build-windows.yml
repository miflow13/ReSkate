name: Build Windows client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset vs2022-x64
      - run: cmake --build --preset release --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: reskate-client
          path: |
            build/vs2022-x64/Release/ReSkate.dll
            build/vs2022-x64/Release/ReSkateLauncher.exe
